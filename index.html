  {article:`1664755`,name:`Кольцо уплотнительное топливного насоса`,spec:`Кольцо уплотнительное топливного насоса резиновое`,tnved:`4016930005`,ntin:`0200284446581`,country:`Великобритания`,brand:`PACCAR`},
  {article:`1684900`,name:`Термостат охлаждающей жидкости`,spec:`Термостат охлаждающей жидкости — это автоматический клапан в системе охлаждения двигателя, который открывается и закрывается в зависимости от температуры охлаждающей жидкости.`,tnved:`8481805100`,ntin:`0200284447229`,country:`Франция`,brand:`PACCAR`},
  {article:`1736755`,name:`Стопорная шайба коленчатого вала двигателя`,spec:`Стопорная шайба коленчатого вала двигателя метал`,tnved:`7318210009`,ntin:`0200284447854`,country:`Франция`,brand:`PACCAR`},
  {article:`1739222`,name:`Втулка цилиндра подъема кабины`,spec:`Втулка цилиндра подъема кабины резиновая`,tnved:`4016930005`,ntin:`0200307092740`,country:`Нидерланды`,brand:`DAF`},
  {article:`1809340`,name:`Датчик скорости импульсный КПП`,spec:`Датчик скорости импульсный КПП — это электронный датчик, который измеряет скорость вращения выходного вала коробки передач и передаёт сигнал в электронный блок управления (ЭБУ) или приборную панель.`,tnved:`9029100009`,ntin:`0200284449728`,country:`Германия`,brand:`DAF`},
  {article:`1857675`,name:`Колба сепаратора в комплекте (резервуар влагоотделителя)`,spec:`Колба сепаратора в комплекте с уплотнениями и клапаном слива`,tnved:`8421990006`,ntin:`0200284451233`,country:`Германия`,brand:`DAF`}
];

let currentSortCol = -1;
let sortAsc = true;

function init() {
  document.getElementById('total-count').textContent = partsData.length;
  populateCountryFilter();
  renderTable(partsData);

  document.getElementById('searchInput').addEventListener('input', filterData);
  document.getElementById('brandFilter').addEventListener('change', filterData);
  document.getElementById('countryFilter').addEventListener('change', filterData);
}

function populateCountryFilter() {
  const countries = [...new Set(partsData.map(item => item.country))].sort();
  const select = document.getElementById('countryFilter');
  countries.forEach(country => {
    if (country) {
      const option = document.createElement('option');
      option.value = country;
      option.textContent = country;
      select.appendChild(option);
    }
  });
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  const noResults = document.getElementById('noResults');
  tbody.innerHTML = '';

  document.getElementById('result-count').textContent = data.length;

  if (data.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  data.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="col-article">${item.article || ''}</td>
      <td class="col-name">${item.name || ''}</td>
      <td class="col-spec">${item.spec || ''}</td>
      <td class="col-code">${item.tnved || ''}</td>
      <td class="col-code">${item.ntin || ''}</td>
      <td>${item.country || ''}</td>
      <td><span class="badge">${item.brand || ''}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function filterData() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const brand = document.getElementById('brandFilter').value;
  const country = document.getElementById('countryFilter').value;

  const filtered = partsData.filter(item => {
    const matchesSearch = !search || 
      (item.article && item.article.toLowerCase().includes(search)) ||
      (item.name && item.name.toLowerCase().includes(search)) ||
      (item.spec && item.spec.toLowerCase().includes(search)) ||
      (item.tnved && item.tnved.toLowerCase().includes(search)) ||
      (item.ntin && item.ntin.toLowerCase().includes(search));

    const matchesBrand = !brand || item.brand === brand;
    const matchesCountry = !country || item.country === country;

    return matchesSearch && matchesBrand && matchesCountry;
  });

  renderTable(filtered);
}

function sortTable(colIndex) {
  const keys = ['article', 'name', 'spec', 'tnved', 'ntin', 'country', 'brand'];
  const key = keys[colIndex];

  if (currentSortCol === colIndex) {
    sortAsc = !sortAsc;
  } else {
    currentSortCol = colIndex;
    sortAsc = true;
  }

  partsData.sort((a, b) => {
    const valA = (a[key] || '').toString().toLowerCase();
    const valB = (b[key] || '').toString().toLowerCase();
    return sortAsc ? valA.localeCompare(valB, 'ru') : valB.localeCompare(valA, 'ru');
  });

  filterData();
}

window.onload = init;
</script>
</body>
</html>
